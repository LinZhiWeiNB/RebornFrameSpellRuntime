syntax = "proto3";

option csharp_namespace = "RebornFrame.Spell";

// 一份法术模块数据。多个开发者可以各提供一份，启动时合并。
message SpellModuleData {
  repeated AttributeDefinitionConfig attributes = 1;
  repeated TagDefinitionConfig tags = 2;
  repeated BuffDefinitionConfig buffs = 3;
  repeated SpellData spells = 4;
  // 全体单位共用的属性默认值。
  repeated UnitAttributeDefaultConfig attribute_layout = 5;
}

// 一条法术。事件通过 buff_ids 引用模块里的 Buff。
message SpellData {
  uint64 id = 1;
  // SpellActivation：1 Active，2 Passive。
  int32 activation = 2;
  // 被动必须为 0。
  int32 duration_frames = 3;
  // 被动必须为 0。
  int32 cooldown_frames = 4;
  // BuffTagQuery：1 All，2 Any，3 NotAny。没有准入 Tag 时为 0。
  int32 admission = 5;
  repeated uint64 admission_tags = 6;
  repeated SpellEventConfig events = 7;
  // trigger 为 0 表示没有结束事件。
  SpellEventConfig end_event = 8;
}

// 时间轴上的一条事件。触发后先看持有者条件，再拾取目标，然后提交 Buff。
message SpellEventConfig {
  // SpellEventTrigger：1 OnStart，2 Frame，3 EveryFrames，4 Signal，5 OnEnd。
  int32 trigger = 1;
  int32 frame = 2;
  uint64 signal_id = 3;
  int32 cooldown_frames = 4;
  int32 condition = 5;
  repeated uint64 condition_tags = 6;
  int32 target_filter = 7;
  repeated uint64 target_filter_tags = 8;
  uint64 pick = 9;
  repeated uint64 buff_ids = 10;
}

// 自定义属性。默认值写在 attribute_layout。
message AttributeDefinitionConfig {
  uint64 id = 1;
  // AttributeValueKind：1 Int32，2 Int64，3 Fixed64，4 Bool。
  int32 value_kind = 2;
  // AttributeBehavior：1 Resource，2 Numeric，3 Marker。
  int32 behavior = 3;
  bool non_negative = 4;
  bool scale_current_with_max = 5;
}

// 全体单位共用的一条属性默认值。value_kind 必须与属性定义一致。
message UnitAttributeDefaultConfig {
  uint64 attribute_id = 1;
  int32 value_kind = 2;
  int64 raw = 3;
}

// 自定义 Tag。parent_id 为 0 表示根节点。
message TagDefinitionConfig {
  uint64 id = 1;
  uint64 parent_id = 2;
}

// 一条 Buff 定义，字段与 BuffDefinitionData 对应。
message BuffDefinitionConfig {
  uint64 id = 1;
  int32 duration_policy = 2;
  int32 identity = 3;
  int32 max_stacks = 4;
  int32 overflow = 5;
  int32 duration_mode = 6;
  int32 refresh_policy = 7;
  int32 period_reset = 8;
  uint64 exclusive_group = 9;
  int32 exclusive_priority = 10;
  int32 duration_scope = 11;
  uint64 duration_iterator = 12;
  int32 duration_steps = 13;
  int32 requirement = 14;
  repeated uint64 required_tags = 15;
  repeated uint64 immunity_tags = 16;
  repeated uint64 granted_tags = 17;
  repeated BuffEffectConfig create_effects = 18;
  repeated BuffEffectConfig update_effects = 19;
  repeated BuffEffectConfig remove_effects = 20;
  repeated BuffPeriodicTriggerConfig periodic_triggers = 21;
  repeated BuffSignalTriggerConfig signal_triggers = 22;
}

// Buff 上的一条效果。parameters 是该 effect_id 自己的 message 字节。
message BuffEffectConfig {
  uint64 effect_id = 1;
  uint32 version = 2;
  bytes parameters = 3;
}

// 周期触发器。
message BuffPeriodicTriggerConfig {
  int32 scope = 1;
  uint64 iterator_id = 2;
  int32 interval = 3;
  repeated BuffEffectConfig effects = 4;
}

// 外部信号触发器。
message BuffSignalTriggerConfig {
  uint64 signal_id = 1;
  int32 interval = 2;
  int32 query = 3;
  repeated uint64 tags = 4;
  repeated BuffEffectConfig effects = 5;
}

// 登记属性修改器的参数。
message AddModifierBuffEffectConfig {
  uint64 attribute = 1;
  int32 channel = 2;
  int32 operation = 3;
  int32 order = 4;
  int32 modifier_local_id = 5;
  int64 value_bits = 6;
}

// 提交资源当前值变化的参数。
message RequestCurrentValueBuffEffectConfig {
  uint64 attribute = 1;
  int64 delta_bits = 2;
}

// 授予 Tag 的参数。
message GrantTagBuffEffectConfig {
  uint64 tag = 1;
}

// 移除 Tag 的参数。
message RemoveTagBuffEffectConfig {
  uint64 tag = 1;
}
